name: NHL schedule

on:
  schedule:
    # 16:03 по Москве = 13:03 UTC. GitHub часто стартует на часы позже.
    - cron: "3 13 * * *"
  workflow_dispatch:
    inputs:
      post:
        description: Что отправить
        type: choice
        default: schedule
        options:
          - schedule
          - results

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python nhl_bot.py ${{ inputs.post || 'schedule' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Remember posted slate
        run: |
          git config user.name "nhl-bot"
          git config user.email "nhl-bot@users.noreply.github.com"
          git add last_slate.txt
          git diff --cached --quiet && exit 0
          git commit -m "Mark NHL slate as posted"
          git push
